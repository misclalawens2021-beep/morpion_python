<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpion Multijoueur 🎮</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <div id="reaction-toast-container"></div>
    <div id="bg-animated" aria-hidden="true"></div>
    <div class="container">
        <h1>🎮 Morpion</h1>
        <p class="subtitle">Jouez en ligne avec un ami en temps réel !</p>

        <div id="player-name-section">
            <div class="player-input">
                <input type="text" id="player-name" placeholder="Votre pseudo..." maxlength="20" autofocus>
                <button class="btn-primary" id="start-btn" onclick="joinOrCreateGame()">🚀 Commencer</button>
            </div>
            <p style="text-align:center; font-size:0.8em; color:#888; margin-top:5px;">
                ou partagez un lien pour inviter un ami
            </p>
            <div class="solo-section">
                <span class="solo-separator">— ou —</span>
                <div class="solo-controls">
                    <label for="solo-level">Niveau :</label>
                    <select id="solo-level">
                        <option value="easy">😊 Facile</option>
                        <option value="medium">🙂 Moyen</option>
                        <option value="hard" selected>😈 Imbattable</option>
                    </select>
                    <button class="btn-solo" id="solo-btn" onclick="startSoloGame()">🤖 Jouer contre l'ordinateur</button>
                </div>
            </div>
        </div>

        <div id="status">Entrez votre pseudo et cliquez sur Commencer</div>

        <div id="scoreboard" class="hide">
            <div class="score-player score-x">
                <span id="score-name-x">Joueur X</span>
                <span id="score-val-x" class="score-badge">0</span>
            </div>
            <div class="score-player score-draw">
                <span>Nuls</span>
                <span id="score-val-draw" class="score-badge">0</span>
            </div>
            <div class="score-player score-o">
                <span id="score-name-o">Joueur O</span>
                <span id="score-val-o" class="score-badge">0</span>
            </div>
        </div>

        <div id="room-info">
            <span class="label">🏠 Salle :</span>
            <span id="room-id" style="font-weight:600;color:#333;"></span>
            <span style="margin: 0 8px;">|</span>
            <span id="room-link" onclick="copyRoomLink()">📋 Copier le lien</span>
            <br>
            <span style="font-size:0.8em;color:#888;">
                👥 <span id="player-count">1</span> joueur(s) connecté(s)
            </span>
        </div>

        <div id="board"></div>

        <div class="controls">
            <button id="reset-btn" class="btn-warning hide" onclick="resetGame()">🔄 Nouvelle partie</button>
            <button id="quit-btn" class="btn-danger hide" onclick="quitGame()">🚪 Quitter</button>
        </div>

        <div id="reaction-panel" class="hide">
            <span class="reaction-title">Envoyer une réaction :</span>
            <div class="reaction-buttons">
                <button class="btn-react" onclick="sendReaction('😂')">😂</button>
                <button class="btn-react" onclick="sendReaction('😢')">😢</button>
                <button class="btn-react" onclick="sendReaction('😮')">😮</button>
                <button class="btn-react" onclick="sendReaction('🔥')">🔥</button>
                <button class="btn-react" onclick="sendReaction('👍')">👍</button>
                <button class="btn-react" onclick="sendReaction('👑')">👑</button>
            </div>
        </div>

        <div class="version">Morpion Multijoueur v2.0</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="./assets/js/app.js"></script>
</body>
</html>
